{% set name = "pypdf" %}
{% set version = "5.9.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  - folder: dist
    url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 30f67a614d558e495e1fbb157ba58c1de91ffc1718f5e0dfeb82a029233890a1
  - folder: src
    url: https://github.com/py-pdf/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: 124be28cc4dc1a9d7e160b5bf5a87b3ba8ec5a438a054918fda4076c73ba511f

build:
  number: 0

outputs:
  - name: pypdf
    build:
      script: cd dist && python -m pip install . -vv --no-deps --no-build-isolation
      skip: true  # [py<38]
    requirements:
      host:
        - python
        - flit-core >=3.11,<4
        - pip
      run:
        - python
        - typing_extensions >=4.0  # [py<311]
    test: &simple-test
      imports:
        - pypdf
      commands:
        - pip check
      requires:
        - pip

  - name: pypdf-with-crypto
    build:
      skip: true  # [py<38]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        - cryptography
    test: *simple-test

  - name: pypdf-with-image
    build:
      skip: true  # [py<38]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        - pillow >=8.0.0
    test: *simple-test

  - name: pypdf-with-full
    build:
      skip: true  # [py<38]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf-with-crypto", exact=True) }}
        - {{ pin_subpackage("pypdf-with-image", exact=True) }}
        - {{ pin_subpackage("pypdf", exact=True) }}
    test: *simple-test

about:
  home: https://pypi.org/project/pypdf
  summary: A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  description: |
    pypdf is a free and open-source pure-python PDF library capable of splitting, merging, cropping, and transforming the pages of PDF files. It can also add custom data, viewing options, and passwords to PDF files. pypdf can retrieve text and metadata from PDFs as well.
  license: BSD-3-Clause
  license_family: BSD
  license_file: dist/LICENSE
  dev_url: https://github.com/py-pdf/pypdf
  doc_url: https://pypdf.readthedocs.io

extra:
  feedstock-name: pypdf
  recipe-maintainers:
    - MartinThoma
    - bollwyvl
