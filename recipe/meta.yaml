{% set name = "pypdf" %}
{% set version = "6.15.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d39c4d955a76409284a905e2d65b40076d77ab76129e0faaeeb6612403ecfc79

build:
  number: 1

outputs:
  - name: {{ name }}
    build:
      script:
        # anaconda channel are failing our security scanner because they bundle encrypted (password‑protected) PDFs as test fixtures. The scanner unpacks each artifact and can't open an encrypted PDF, so it flags the whole package PASSWORD_PROTECTED and blocks it.
        # pypdf's test suite ships under info/test/resources/, including ~11 encrypted PDFs (e.g. encryption/r2-r4-*.pdf, encrypted-file.pdf).
        - rm -rf ${SRC_DIR}/resources/encryption ${SRC_DIR}/resources/encrypted-file.pdf ${SRC_DIR}/resources/encrypted_doc_no_id.pdf ${SRC_DIR}/resources/libreoffice-writer-password.pdf ${SRC_DIR}/resources/crazyones-encrypted-256.pdf
        - python -m pip install . -vv --no-deps --no-build-isolation
      skip: true  # [py<39]
    requirements:
      host:
        - pip
        - python
        - flit-core >=3.11,<4
      run:
        - python
        - typing_extensions >=4.0  # [py<311]
    test:
      source_files:
        - tests
        - resources
      files:
        - test_all.py
      imports:
        - pypdf
      commands:
        - pip check
        # we need to ignore test_all.py because it is not a test file
        - set "PYTEST_ADDOPTS=--ignore=test_all.py"  # [win]
        - python test_all.py                          # [win]
        - PYTEST_ADDOPTS="--ignore=test_all.py" python test_all.py  # [not win]
      requires:
        - pip
        - pytest
        - pytest-cov
        - pyyaml
        - pillow
        - fonttools
        - python-bidi
        # Anaconda package name uses underscore (arabic_reshaper-feedstock), not PyPI hyphen
        - arabic_reshaper  # [py>=310]

  - name: {{ name }}-with-crypto
    build:
      skip: true  # [py<39]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        - cryptography >=3.0
    test:
      commands:
        - pip check
      requires:
        - pip

  - name: {{ name }}-with-image
    build:
      skip: true  # [py<39]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        - pillow >=8.0.0
    test:
      commands:
        - pip check
      requires:
        - pip

  - name: {{ name }}-with-fonts
    build:
      skip: true  # [py<39]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        - fonttools
    test:
      commands:
        - pip check
      requires:
        - pip

  # arabic_reshaper (underscore — AnacondaRecipes/arabic_reshaper-feedstock) needs py>=3.10
  - name: {{ name }}-with-rtl-text
    build:
      skip: true  # [py<310]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf", exact=True) }}
        # conda package is arabic_reshaper (underscore), not arabic-reshaper
        - arabic_reshaper
        - python-bidi
    test:
      commands:
        - pip check
      requires:
        - pip

  - name: {{ name }}-with-full
    build:
      skip: true  # [py<39]
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("pypdf-with-crypto", exact=True) }}
        - {{ pin_subpackage("pypdf-with-image", exact=True) }}
        - {{ pin_subpackage("pypdf-with-fonts", exact=True) }}
        - {{ pin_subpackage("pypdf-with-rtl-text", exact=True) }}  # [py>=310]
        - {{ pin_subpackage("pypdf", exact=True) }}
    test:
      commands:
        - pip check
      requires:
        - pip

about:
  home: https://pypi.org/project/pypdf
  summary: A pure-python PDF library capable of splitting, merging, cropping, and transforming PDF files
  description: |
    pypdf is a free and open-source pure-python PDF library capable of splitting, merging, cropping, and transforming the pages of PDF files. It can also add custom data, viewing options, and passwords to PDF files. pypdf can retrieve text and metadata from PDFs as well.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/py-pdf/pypdf
  doc_url: https://pypdf.readthedocs.io

extra:
  feedstock-name: pypdf
  recipe-maintainers:
    - MartinThoma
    - bollwyvl
